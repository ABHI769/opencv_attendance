services:
  - type: web
    name: attendance-system
    env: docker
    plan: free
    healthCheckPath: /api/health
    httpPort: 5000
    envVars:
      - key: PORT
        value: 5000
      - key: PYTHONUNBUFFERED
        value: "1"

# NOTE on persistent storage:
# Render's 'free' tier does not support persistent disks.
# If you upgrade to Render 'starter' tier ($7/mo) or above, uncomment the disks section below
# to persist your attendance.db across redeployments:
#
#    envVars:
#      - key: DATABASE_PATH
#        value: /data/attendance.db
# disks:
#   - name: attendance-data
#     sizeGB: 1
#     mountPath: /data
